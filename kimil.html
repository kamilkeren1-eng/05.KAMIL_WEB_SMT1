<body>

    <button onclick="hapusteks()">Klik</button>

    <button onclick="tambah()">Klik Saya</button>

    <button onclick="tambahklik()">Klik Saya!</button>

    <P id="teks">ini paragraf dengan style default.</P>
    <button onclick="ubahstyle()">Ubah Style</button>

    <script>
// MENGHSPUS
    function hapusteks() {
    document.getElementsByTagName("p")[0].remove();
    }

// MENAMBAH 
    function tambah() {
        let elemen = document.createElement("p");
        elemen.textContent = "Teks Baru Muncul!";
        document.getElementById("hasil").appendChild(elemen);
    }

//APK WIRIDAN
    let jumlahklik = 0;
    function tambahklik() {
        jumlahklik++;
        document.getElementById("hitung").textContent = jumlahklik;
    }
